<!DOCTYPE html>
<html dir="ltr" lang="pt-br">

<head>
    <title>Login</title>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="../assets/css/estilo.css" rel="stylesheet" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap');
    </style>
    <link rel="stylesheet" href="../assets/css/footer-global.css">
</head>

<body class="auth-body">
    <div class="conteudo">
        <img alt="Logo da empresa RiseAPP" src="../assets/img/logo (2).png" />
        <h1>Sua evolução, nossa missão.</h1>
        <form action="informacoes-aluno.html">
            <label class="campo" for="email">E-mail</label>
            <input class="input" id="email" name="email" required="" type="email" />
            <label class="campo" for="senha">Senha</label>
            <input class="input" id="senha" name="senha" required="" type="password" />
            <a class="esqueci-senha" href="recuperar-senha.html">Esqueci a senha</a>
            <button class="botao" type="submit">Entrar</button>
            <div class="criar-conta">
                <h5>Não tem uma conta?</h5>
                <a class="criar" href="cadastro.html">Criar conta!</a>
            </div>
        </form>
    </div>

    <footer class="rise-footer" id="contato">
        <div class="rise-footer-conteudo">
            <div>
                <img src="../assets/img/logo (2).png" alt="Logo RiseAPP">
                <p>RiseAPP — gestão inteligente para personal, aluno e academia.</p>
            </div>
            <div>
                <h3>Acesso rápido</h3>
                <a href="../index.html">Início</a>
                <a href="login.html">Aluno</a>
                <a href="login-personal.html">Personal</a>
                <a href="../admin/loginadm.html">Admin</a>
            </div>
            <div>
                <h3>Contato</h3>
                <p>riseapp.com</p>
                <p>(18) 99523-2423</p>
            </div>
        </div>
        <p class="rise-copy">© 2026 RiseAPP. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
